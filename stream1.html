      align-items: center;

      color: var(--muted);

    /* ===== RESPONSIVE ===== */
    @media (max-width: 650px) {

<script>
  // ===== AD CLOSE + AUTO REOPEN =====
  function closeAd(adId) {
    const ad = document.getElementById(adId);
    if (!ad) return;
    ad.style.display = 'none';
    setTimeout(function() {
      ad.style.display = '';
    }, 2500);
  }

  // ===== STREAM PAGE LOGIC =====
  (function() {
    const params = new URLSearchParams(window.location.search);

    // ===== MATCH INFO =====
    const t1 = params.get('t1') || 'Team 1';
    const t2 = params.get('t2') || 'Team 2';
    const logo1 = params.get('logo1') || '';
    const logo2 = params.get('logo2') || '';
    const league = params.get('league') || 'Sports';
    const leagueLogo = params.get('leaguelogo') || '';
    const sport = params.get('sport') || '';

    document.title = `${t1} vs ${t2} Live Stream | Streameast`;
    document.getElementById('team1Name').textContent = t1;
    document.getElementById('team2Name').textContent = t2;
    document.getElementById('leagueName').textContent = league;

    const img1 = document.getElementById('team1Logo');
    const img2 = document.getElementById('team2Logo');
    if (logo1) {
      img1.src = logo1;
      img1.onerror = function() { this.src = 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png'; };
    }
    if (logo2) {
      img2.src = logo2;
      img2.onerror = function() { this.src = 'https://a.espncdn.com/i/teamlogos/default-team-logo-500.png'; };
    }
    if (leagueLogo) {
      const lImg = document.getElementById('leagueLogo');
      lImg.src = leagueLogo;
      lImg.style.display = '';
      lImg.onerror = function() { this.style.display = 'none'; };
    }

    // ===== COLLECT STREAM URLS =====
    const streams = [];
    ['stream', 'stream2', 'stream3', 'stream4', 'stream5', 'stream6', 'stream7', 'stream8'].forEach(function(key) {
      const u = (params.get(key) || '').trim();
      if (u && u.indexOf('http') === 0 && streams.indexOf(u) === -1) {
        streams.push(u);
      }
    });

    const frame = document.getElementById('streamFrame');
    const playerError = document.getElementById('playerError');
    const streamBtns = document.getElementById('streamBtns');
    const streamLabel = document.getElementById('streamLabel');
    let currentIdx = 0;

    function loadStream(idx) {
      if (!streams.length) {
        frame.style.display = 'none';
        playerError.style.display = 'flex';
        streamLabel.textContent = 'No Streams';
        return;
      }
      currentIdx = idx;
      frame.style.display = '';
      playerError.style.display = 'none';
      // cache-bust reload
      const sep = streams[idx].indexOf('?') !== -1 ? '&' : '?';
      frame.src = streams[idx] + sep + '_se=' + Date.now();
      streamLabel.textContent = `Stream ${idx + 1} of ${streams.length}`;
      // update active button
      streamBtns.querySelectorAll('.stream-btn').forEach(function(b, i) {
        b.classList.toggle('active', i === idx);
      });
    }

    function buildStreamButtons() {
      streamBtns.innerHTML = '';
      if (!streams.length) return;
      streams.forEach(function(u, i) {
        const btn = document.createElement('button');
        btn.className = 'stream-btn' + (i === 0 ? ' active' : '');
        const icon = document.createElement('i');
        icon.className = 'fas fa-play';
        btn.appendChild(icon);
        btn.appendChild(document.createTextNode(' Stream ' + (i + 1)));
        btn.addEventListener('click', function() {
          loadStream(i);
        });
        streamBtns.appendChild(btn);
      });
    }

    // ===== TOOLBAR BUTTONS =====
    document.getElementById('refreshBtn').addEventListener('click', function() {
      loadStream(currentIdx);
    });

    document.getElementById('fullscreenBtn').addEventListener('click', function() {
      const box = document.getElementById('playerBox');
      if (!document.fullscreenElement) {
        if (box.requestFullscreen) box.requestFullscreen();
        else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });

    // ===== INIT =====
    buildStreamButtons();
    loadStream(0);
  })();
</script>
